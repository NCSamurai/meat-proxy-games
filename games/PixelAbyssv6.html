function storageGet(k,d){try{let v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function storageSet(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function loadNum(k,d){let v=parseFloat(storageGet(k,d));return Number.isFinite(v)?v:d;}
function loadBool(k,d){let v=storageGet(k,d?"1":"0");return v==="1"||v==="true";}

function rand(a=1,b=0){ if(b===0){b=a;a=0;} return a+Math.random()*(b-a); }
function irand(a,b){return Math.floor(rand(a,b+1));}
function choice(a){return a[(Math.random()*a.length)|0];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}
function dist2(ax,ay,bx,by){let dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}
function angleTo(ax,ay,bx,by){return Math.atan2(by-ay,bx-ax);}
function angleDiff(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b));}
function easeOutCubic(t){return 1-Math.pow(1-clamp(t,0,1),3);}
function easeInOut(t){return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;}
function vecFromAngle(a){return {x:Math.cos(a),y:Math.sin(a)};}
function norm(x,y){let l=Math.hypot(x,y);return l?{x:x/l,y:y/l}:{x:0,y:0};}
function drawPixelRect(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function text(g,s,x,y,size,c,align="center",base="middle",shadow=true){
  g.save(); g.font=`900 ${size}px "Courier New", monospace`; g.textAlign=align; g.textBaseline=base;
  if(shadow){g.fillStyle="#000";g.globalAlpha=.65;g.fillText(s,Math.round(x)+3,Math.round(y)+3);g.globalAlpha=1;}
  g.fillStyle=c; g.fillText(s,Math.round(x),Math.round(y)); g.restore();
}
function strokeText(g,s,x,y,size,c,stroke="#000",lw=4,align="center"){
  g.save(); g.font=`900 ${size}px "Courier New", monospace`; g.textAlign=align; g.textBaseline="middle";
  g.lineWidth=lw; g.strokeStyle=stroke; g.strokeText(s,Math.round(x),Math.round(y)); g.fillStyle=c; g.fillText(s,Math.round(x),Math.round(y)); g.restore();
}
function wrappedText(g,s,x,y,maxW,lineH,size,c,align="center"){
  var words=String(s).split(" "),lines=[],line="";
  g.save(); g.font=`900 ${size}px "Courier New", monospace`;
  for(var i=0;i<words.length;i++){
    var test=line?line+" "+words[i]:words[i];
    if(g.measureText(test).width>maxW&&line){lines.push(line);line=words[i];}else line=test;
  }
  if(line)lines.push(line);
  for(var j=0;j<lines.length;j++)text(g,lines[j],x,y+j*lineH,size,c,align,"middle",true);
  g.restore();
  return lines.length;
}
function fillBar(g,x,y,w,h,p,fg,bg="#15121f",border="#ffffff"){
  p=clamp(p,0,1); g.fillStyle=bg; g.fillRect(x,y,w,h); g.strokeStyle=border; g.lineWidth=2; g.strokeRect(x,y,w,h);
  g.fillStyle=fg; g.fillRect(x+2,y+2,(w-4)*p,h-4);
}
function circle(g,x,y,r,c,a=1){g.save();g.globalAlpha=a;g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.restore();}

function biomeIndexForStage(i){i=Math.floor(Number.isFinite(i)?i:0);return ((i%BIOME_COUNT)+BIOME_COUNT)%BIOME_COUNT;}
function stageProgress(i){return FINAL_STAGE_INDEX <= 0 ? 0 : clamp(Math.floor(i),0,FINAL_STAGE_INDEX) / FINAL_STAGE_INDEX;}
function stageDifficulty(i){
  var n=clamp(Math.floor(Number.isFinite(i)?i:0),0,FINAL_STAGE_INDEX), p=stageProgress(n), curve=p*p;
  return {
    ordinal:n,
    progress:p,
    mobHp:1+n*DIFFICULTY_CURVE.mobHpPerStage+curve*DIFFICULTY_CURVE.mobHpCurve,
    mobDamage:DIFFICULTY_CURVE.enemyDamageBoost*(1+n*DIFFICULTY_CURVE.mobDamagePerStage+curve*DIFFICULTY_CURVE.mobDamageCurve),
    mobSpeed:1+n*DIFFICULTY_CURVE.mobSpeedPerStage+curve*DIFFICULTY_CURVE.mobSpeedCurve,
    miniHp:1+n*DIFFICULTY_CURVE.miniHpPerStage+curve*DIFFICULTY_CURVE.miniHpCurve,
    miniDamage:DIFFICULTY_CURVE.enemyDamageBoost*DIFFICULTY_CURVE.miniDamageBase*(1+n*DIFFICULTY_CURVE.miniDamagePerStage+curve*DIFFICULTY_CURVE.miniDamageCurve),
    miniSpeed:1+n*DIFFICULTY_CURVE.miniSpeedPerStage+curve*DIFFICULTY_CURVE.miniSpeedCurve,
    bossHp:1+n*DIFFICULTY_CURVE.bossHpPerStage+curve*DIFFICULTY_CURVE.bossHpCurve,
    bossDamage:DIFFICULTY_CURVE.enemyDamageBoost*(1+n*DIFFICULTY_CURVE.bossDamagePerStage+curve*DIFFICULTY_CURVE.bossDamageCurve),
    bossSpeed:DIFFICULTY_CURVE.bossSpeedBoost*(1+n*DIFFICULTY_CURVE.bossSpeedPerStage+curve*DIFFICULTY_CURVE.bossSpeedCurve),
    bossAttackRate:1+n*DIFFICULTY_CURVE.bossAttackRatePerStage+curve*DIFFICULTY_CURVE.bossAttackRateCurve,
    spawnFlat:n*DIFFICULTY_CURVE.spawnFlatPerStage,
    spawnCount:1+n*DIFFICULTY_CURVE.spawnCountPerStage+curve*DIFFICULTY_CURVE.spawnCountCurve,
    spawnInterval:1/(1+n*DIFFICULTY_CURVE.spawnIntervalPerStage+curve*DIFFICULTY_CURVE.spawnIntervalCurve),
    maxEnemies:55+Math.round(n*DIFFICULTY_CURVE.maxEnemiesPerStage),
    bigChance:clamp(.10+n*DIFFICULTY_CURVE.bigChancePerStage+curve*.04,.10,.28),
    mediumChance:clamp(.28+n*DIFFICULTY_CURVE.mediumChancePerStage+curve*.02,.28,.40)
  };
}
function bossHpForStage(i){
  return i===FINAL_STAGE_INDEX?TRUE_FINAL_BOSS_HP:Math.round(DIFFICULTY_CURVE.bossBaseHp*stageDifficulty(i).bossHp);

function mulberry32(seed){

function updateChaos(dt){

  if(chaos.currentEvent){
    chaos.eventDuration-=dt;
    if(chaosActive("gravity")&&Math.random()<dt*16)addParticle(rand(40,W-40),rand(50,H-40),0,rand(20,60),chaos.currentEvent.color,rand(.4,.9),3);
    if(chaos.eventDuration<=0){
      var ev=chaos.currentEvent; if(ev.revert)ev.revert();
      chaos.currentEvent=null; chaos.eventDuration=0; chaos.eventTimer=30;
    }
    return;
  }
  chaos.eventTimer-=dt;
  if(chaos.eventTimer<=0){
    var idx=Math.floor(chaosRoll()*6);
    if(idx===chaos.lastEventIndex)idx=Math.floor(chaosRoll()*6);
    chaos.lastEventIndex=idx;
    var event=chaos.events[idx]; chaos.currentEvent=event; chaos.eventDuration=event.duration; chaos.bannerTime=2;

  if(eventQueue.length||eventBadge>0){ctx.save();ctx.globalAlpha=.85;ctx.fillStyle="#201a2e";ctx.fillRect(W/2-90,88,180,26);ctx.strokeStyle="#ffd35a";ctx.strokeRect(W/2-90,88,180,26);text(ctx,`EVENT PENDING x${eventQueue.length}`,W/2,102,13,"#ffd35a");ctx.restore();}
}
function drawArtifactHUD(){
  if(!player||!player.activeArtifacts||!player.activeArtifacts.length)return;
  var y=player.shield > 0 ? 68 : 54;
  for(var i=0;i<player.activeArtifacts.length;i++){
    var art=artifactById(player.activeArtifacts[i]); if(!art)continue;
    var x=22+i*30; ctx.fillStyle="#101018";ctx.fillRect(x,y,24,24);ctx.strokeStyle=art.color;ctx.lineWidth=2;ctx.strokeRect(x,y,24,24);text(ctx,art.icon,x+12,y+13,16,art.color,"center","middle",false);
  }
}
function drawChaosHUD(){
  if(!chaos||!chaos.enabled||!chaos.currentEvent)return;
  var ev=chaos.currentEvent,pulse=.55+.25*Math.sin(gameTime*8);
  ctx.save();ctx.globalAlpha=.92;ctx.fillStyle="#07030d";ctx.fillRect(300,0,360,18);ctx.strokeStyle=ev.color;ctx.lineWidth=2;ctx.strokeRect(300,0,360,18);ctx.globalAlpha=1;text(ctx,`★ CHAOS: ${ev.name} ★  ${Math.ceil(chaos.eventDuration)}s left`,W/2,9,12,ev.color,"center","middle",false);ctx.restore();
  if(chaos.bannerTime>0){ctx.save();ctx.globalAlpha=clamp(chaos.bannerTime/2,0,1);ctx.fillStyle="#000";ctx.fillRect(0,H/2-58,W,116);strokeText(ctx,`CHAOS: ${ev.name}`,W/2,H/2,38,ev.color,"#000",8);ctx.restore();}
}
function drawAbilityHUD(){
  let x=22,y=H-72,items=[["LMB","primary","primary",player.cool.primary,player.primaryCd()],["RMB","special","special",player.cool.special,player.abilityCd(player.cls.special.cd,"special")],["T","clone","clone",player.cool.clone,player.abilityCd(18)],["Q","slime","slime",player.cool.slime,player.abilityCd(14)],["F","bone","bone",player.cool.bone,player.abilityCd(12)]];

function drawBottomRightHUD(){
  let x=W-250,y=H-72,prog=clamp(runCrystals/Math.max(1,nextCrystalMilestone),0,1); fillBar(ctx,x+8,y+42,220,14,prog,"#7fffee","#16111d","#ddd");text(ctx,`NEXT RNG WHEEL: ${nextCrystalMilestone}`,x+118,y+30,12,"#ffffff");

}
function drawOverlayShade(alpha=.65,color="#05030a"){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.fillRect(0,0,W,H);ctx.restore();}
function drawPerkOverlay(){
  drawOverlayShade(.72); strokeText(ctx,"KILL-STREAK PERK",W/2,126,34,"#ffd35a","#2b1600",6); text(ctx,"Choose one upgrade",W/2,166,16,"#ffffff");
  let w=250,h=178,sy=230; for(let i=0;i<activePerkChoices.length;i++){let x=100+i*(w+35),p=activePerkChoices[i],hover=pointIn(mouse,x,sy,w,h);ctx.fillStyle=hover?"#2f2840":"#191425";ctx.fillRect(x,sy,w,h);ctx.strokeStyle=hover?"#ffd35a":"#786aa0";ctx.lineWidth=3;ctx.strokeRect(x,sy,w,h);text(ctx,p.name,x+w/2,sy+48,20,"#ffd35a");text(ctx,p.desc,x+w/2,sy+96,14,"#ffffff");text(ctx,"CLICK TO CLAIM",x+w/2,sy+142,12,"#a8d8ff");addButton("perk"+i,x,sy,w,h);}
}
function drawWheelOverlay(){
  drawOverlayShade(.74); let wh=activeWheel;if(!wh)return; let cx=W/2,cy=H/2+10,R=190,seg=TAU/WHEEL_ABILITIES.length;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(wh.angle);
  for(let i=0;i<WHEEL_ABILITIES.length;i++){
    let a0=-PI/2+i*seg,a1=a0+seg,mid=a0+seg/2,ab=WHEEL_ABILITIES[i];
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a0,a1);ctx.closePath();ctx.fillStyle=ab.color;ctx.globalAlpha=.85;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle="#0d0814";ctx.lineWidth=3;ctx.stroke();
    ctx.save();ctx.rotate(mid);ctx.textAlign="center";ctx.textBaseline="middle";ctx.font='900 15px "Courier New", monospace';ctx.fillStyle="#05030a";ctx.fillText(ab.name,R*.58,0);ctx.restore();
  }
  ctx.restore();
  ctx.save();ctx.fillStyle="#ffffff";ctx.beginPath();ctx.moveTo(cx,cy-R-22);ctx.lineTo(cx-18,cy-R+18);ctx.lineTo(cx+18,cy-R+18);ctx.closePath();ctx.fill();ctx.restore();
  circle(ctx,cx,cy,42,"#0b0812",1);text(ctx,"ABYSS",cx,cy-7,16,"#ffffff");text(ctx,"WHEEL",cx,cy+12,16,"#ffd35a");
  strokeText(ctx,"CARBON FATE",W/2,78,36,"#7fffee","#001b1b",6);
  if(wh.phase==="call"){let ab=WHEEL_ABILITIES[wh.result];strokeText(ctx,ab.name,W/2,H-104,32,ab.color,"#000",7);text(ctx,ab.desc,W/2,H-66,16,"#ffffff");}
}
function drawCrateOverlay(){
  drawOverlayShade(.72); strokeText(ctx,"BOSS REWARD CRATE",W/2,122,34,"#ffd35a","#2b1600",6); text(ctx,"Choose one run-only upgrade",W/2,162,16,"#ffffff");
  let w=202,h=172,sy=236; for(let i=0;i<CRATE_UPGRADES.length;i++){let x=58+i*(w+28),up=CRATE_UPGRADES[i],hover=pointIn(mouse,x,sy,w,h);ctx.fillStyle=hover?"#392817":"#1d1410";ctx.fillRect(x,sy,w,h);ctx.strokeStyle=hover?"#ffd35a":"#b77a2d";ctx.lineWidth=3;ctx.strokeRect(x,sy,w,h);text(ctx,up.name,x+w/2,sy+50,18,"#ffd35a");text(ctx,up.desc,x+w/2,sy+96,13,"#ffffff");text(ctx,"TAKE",x+w/2,sy+138,13,"#a8d8ff");addButton("crate"+i,x,sy,w,h);}
}
function drawPaused(){drawOverlayShade(.66);strokeText(ctx,"PAUSED",W/2,H/2-20,48,"#ffffff","#000",8);text(ctx,"Press P to resume",W/2,H/2+34,18,"#ffd35a");}
function drawMenu(){
  ctx.fillStyle="#05030a";ctx.fillRect(0,0,W,H);let grad=ctx.createRadialGradient(W/2,H*.35,10,W/2,H*.45,650);grad.addColorStop(0,"#1a1036");grad.addColorStop(1,"#05030a");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  for(const p of menuParticles){ctx.save();ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r);ctx.restore();}
  for(let y=0;y<H;y+=4){ctx.fillStyle="rgba(255,255,255,.025)";ctx.fillRect(0,y,W,1);}
  if(menuMode==="main"){strokeText(ctx,"PIXEL ABYSS",W/2,105,64,"#d9c7ff","#160724",9);text(ctx,"v6 12-STAGE CHAOS ARTIFACT DESCENT",W/2,156,16,"#7fffee");text(ctx,`HIGH SCORE: ${highScore}`,W/2,198,22,"#ffd35a");
    drawButton(W/2-145,246,290,58,"PLAY NOW","play","#24163c","#ffd35a");
    drawButton(W/2-145,318,290,48,chaosModeEnabled?"CHAOS MODE: ON":"CHAOS MODE: OFF","toggleChaos",chaosModeEnabled?"#301322":"#181425",chaosModeEnabled?"#ff75d1":"#8c86a3");
    drawButton(W/2-145,380,290,48,"CLASS SELECT","class","#181425","#d9c7ff");drawButton(W/2-145,440,290,48,"SETTINGS","settings","#181425","#7fffee");
    text(ctx,`SELECTED: ${CLASS_STATS[selectedClassIndex].name}`,W/2,526,18,CLASS_STATS[selectedClassIndex].color);text(ctx,"Tip: Shift auto-aim • RMB special • crystals magnet at 2 tiles",W/2,580,13,"#bca7ff");
  }else{
    strokeText(ctx,"CHOOSE CLASS",W/2,72,40,"#d9c7ff","#160724",7);drawButton(24,62,126,38,"BACK","backMenu","#181425","#ffffff");
    let w=222,h=235,sx=20,sy=130,gap=10;
    for(let i=0;i<CLASS_STATS.length;i++){
      let col=i%4,row=Math.floor(i/4),x=sx+col*(w+gap),y=sy+row*(h+gap),cls=CLASS_STATS[i],sel=i===selectedClassIndex,hover=pointIn(mouse,x,y,w,h);
      ctx.fillStyle=sel?"#2b2047":hover?"#211a31":"#15111f";ctx.fillRect(x,y,w,h);ctx.strokeStyle=sel?"#ffd35a":cls.color;ctx.lineWidth=sel ? 4 : 2;ctx.strokeRect(x,y,w,h);
      ctx.drawImage(SPR.players[cls.id][0],x+w/2-30,y+22,60,60);text(ctx,`${i+1}. ${cls.name}`,x+w/2,y+98,15,cls.color);text(ctx,`HP ${cls.hp}`,x+w/2,y+130,13,"#ffffff");text(ctx,`SPD ${Math.round(cls.speed)}`,x+w/2,y+153,13,"#ffffff");text(ctx,`LMB ${cls.primary.kind}`,x+w/2,y+178,11,"#a8d8ff");text(ctx,cls.special.name.toUpperCase(),x+w/2,y+205,12,"#ffd35a");addButton("select"+i,x,y,w,h);
    }
    text(ctx,"Press 1-8 or click a class",W/2,626,14,"#bca7ff");
  }
}
function drawArtifactOverlay(){
  ctx.fillStyle="#05030a";ctx.fillRect(0,0,W,H);
  var grad=ctx.createRadialGradient(W/2,H*.35,10,W/2,H*.45,680);grad.addColorStop(0,"#24143d");grad.addColorStop(1,"#05030a");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  for(const p of menuParticles){ctx.save();ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r);ctx.restore();}
  strokeText(ctx,"CHOOSE 3 ARTIFACTS",W/2,82,42,"#ffd35a","#2b1600",7);
  text(ctx,artifactSelections.length===3?"3/3 SELECTED — CONFIRM BELOW":`PICK 3 ARTIFACTS (${artifactSelections.length}/3)`,W/2,128,18,artifactSelections.length===3?"#67ff91":"#ffffff");
  text(ctx,`CLASS: ${CLASS_STATS[selectedClassIndex].name}${pendingChaosEnabled?"  •  CHAOS ENABLED":""}`,W/2,158,14,CLASS_STATS[selectedClassIndex].color);
  var w=140,h=170,sx=30,sy=210,gap=18;
  for(var i=0;i<ARTIFACTS.length;i++){
    var art=ARTIFACTS[i],col=i%6,row=Math.floor(i/6),x=sx+col*(w+gap),y=sy+row*(h+gap),sel=artifactSelections.indexOf(art.id)>=0,hover=pointIn(mouse,x,y,w,h);
    ctx.fillStyle=hover?"#241d32":"#14111d";ctx.fillRect(x,y,w,h);ctx.strokeStyle=sel?"#ffd35a":art.color;ctx.lineWidth=sel ? 5 : 2;ctx.strokeRect(x,y,w,h);
    wrappedText(ctx,art.name,x+w/2,y+20,w-12,13,11,art.color);
    text(ctx,art.icon,x+w/2,y+78,38,art.color);
    wrappedText(ctx,art.desc,x+w/2,y+122,w-16,12,10,"#ffffff");
    if(sel){ctx.fillStyle="#ffd35a";ctx.fillRect(x+w-28,y+8,18,18);text(ctx,"✓",x+w-19,y+18,16,"#0b0812","center","middle",false);}
    addButton("artifact"+i,x,y,w,h);
  }
  if(artifactSelections.length===3)drawButton(W/2-130,594,260,42,"CONFIRM","artifactConfirm","#2b220f","#ffd35a");
  else text(ctx,"Click cards to toggle. Selected cards get a gold border.",W/2,616,13,"#bca7ff");
}
function drawSettings(){
  ctx.fillStyle="#05030a";ctx.fillRect(0,0,W,H);for(const p of menuParticles){ctx.save();ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r);ctx.restore();}
  strokeText(ctx,"SETTINGS",W/2,105,46,"#7fffee","#001b1b",7); drawSlider("music",W/2-190,190,380,"MUSIC VOLUME",settings.musicVol); drawSlider("sfx",W/2-190,270,380,"SFX VOLUME",settings.sfxVol);
  drawButton(W/2-190,340,180,48,settings.musicMuted?"MUSIC: OFF":"MUSIC: ON","toggleMusic","#181425",settings.musicMuted?"#ff6670":"#67ff91");
  drawButton(W/2+10,340,180,48,settings.sfxMuted?"SFX: OFF":"SFX: ON","toggleSfx","#181425",settings.sfxMuted?"#ff6670":"#67ff91");
  drawButton(W/2-110,430,220,50,"BACK","settingsBack","#181425","#ffffff");text(ctx,"M toggles SFX • N toggles Music",W/2,525,15,"#bca7ff");
}
function drawSlider(id,x,y,w,label,val){
  text(ctx,label,x+w/2,y-24,16,"#ffffff");ctx.fillStyle="#15111f";ctx.fillRect(x,y,w,18);ctx.strokeStyle="#786aa0";ctx.strokeRect(x,y,w,18);ctx.fillStyle="#7fffee";ctx.fillRect(x+2,y+2,(w-4)*val,14);ctx.fillStyle="#ffd35a";ctx.fillRect(x+w*val-8,y-6,16,30);uiSliders.push({id,x,y:y-8,w,h:34});text(ctx,Math.round(val*100)+"%",x+w+54,y+9,16,"#ffd35a");
}
function drawEndScreen(victory){
  drawGameScene(); drawOverlayShade(victory ? .62 : .68,victory?"#05030a":"#210406"); for(const p of endParticles){ctx.save();ctx.globalAlpha=clamp(p.life/3,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r);ctx.restore();}
  if(victory){let pulse=.5+.5*Math.sin(gameTime*4);ctx.shadowColor="#ffd35a";ctx.shadowBlur=20+25*pulse;strokeText(ctx,"VICTORY",W/2,170,72,"#ffd35a","#3a2100",10);ctx.shadowBlur=0;text(ctx,`${TOTAL_STAGES} STAGES CLEARED`,W/2,226,20,"#fff2a3");}
  else {let sh=Math.sin(gameTime*30)*4;strokeText(ctx,"YOU ARE DEAD",W/2+sh,168,60,"#ff2038","#210000",9);ctx.fillStyle="#9b0d1d";for(let i=0;i<10;i++)ctx.fillRect(W/2-250+i*55+Math.sin(i)*8,205,8,rand(18,45));}
  text(ctx,`FINAL SCORE: ${finalScore}`,W/2,270,24,"#ffffff");text(ctx,`HIGH SCORE: ${finalHigh}${finalNewBest?" (NEW BEST!)":""}`,W/2,310,22,finalNewBest?"#ffd35a":"#7fffee");
  drawButton(W/2-230,380,200,56,victory?"PLAY AGAIN":"TRY AGAIN","again",victory?"#2b220f":"#2a1010",victory?"#ffd35a":"#ff6670"); drawButton(W/2+30,380,200,56,"MAIN MENU","mainMenu","#181425","#ffffff");
}
function drawButton(x,y,w,h,label,id,bg="#181425",fg="#ffffff"){let hover=pointIn(mouse,x,y,w,h);ctx.fillStyle=hover?"#302746":bg;ctx.fillRect(x,y,w,h);ctx.strokeStyle=hover?"#ffd35a":fg;ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);text(ctx,label,x+w/2,y+h/2,20,fg);addButton(id,x,y,w,h);}
function addButton(id,x,y,w,h){uiButtons.push({id,x,y,w,h});}
function pointIn(m,x,y,w,h){return m.x>=x&&m.x<=x+w&&m.y>=y&&m.y<=y+h;}
function render(){
  ctx.imageSmoothingEnabled=false; uiButtons=[];uiSliders=[];ctx.clearRect(0,0,W,H);
  if(state==="menu")drawMenu(); else if(state==="settings")drawSettings(); else if(state==="artifact")drawArtifactOverlay(); else if(state==="victory")drawEndScreen(true); else if(state==="dead")drawEndScreen(false);
  else {drawGameScene(); drawHUD(); if(state==="paused")drawPaused(); if(state==="perk")drawPerkOverlay(); if(state==="wheel")drawWheelOverlay(); if(state==="crate")drawCrateOverlay();}
  cleanupEffects();
}

function handleButton(id){
  audio.resume();
  if(id==="play")newRun(selectedClassIndex);
  else if(id==="toggleChaos"){chaosModeEnabled=!chaosModeEnabled;storageSet(LS.chaos,chaosModeEnabled?"1":"0");audio.sfx("perk");}
  else if(id==="settings")state="settings";
  else if(id==="class")menuMode="class";
  else if(id==="backMenu"){menuMode="main";state="menu";}
  else if(id.startsWith("select")){selectedClassIndex=clamp(parseInt(id.slice(6),10),0,7);storageSet(LS.lastClass,selectedClassIndex);audio.sfx("perk");}
  else if(id==="artifactConfirm")confirmArtifacts();
  else if(id.startsWith("artifact"))toggleArtifactPick(parseInt(id.slice(8),10));
  else if(id==="settingsBack"){state="menu";menuMode="main";}
  else if(id==="toggleMusic"){settings.musicMuted=!settings.musicMuted;saveSettings();audio.sfx("perk");}
  else if(id==="toggleSfx"){settings.sfxMuted=!settings.sfxMuted;saveSettings();audio.sfx("perk");}
  else if(id.startsWith("perk"))choosePerk(parseInt(id.slice(4),10));
  else if(id.startsWith("crate"))chooseCrate(parseInt(id.slice(5),10));
  else if(id==="again")newRun(selectedClassIndex);
  else if(id==="mainMenu"){state="menu";menuMode="main";resetArrays();player=null;chaos=null;initMenuParticles();}
}
function pointerPos(e){let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
canvas.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("contextmenu",e=>e.preventDefault());
canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();audio.resume();let p=pointerPos(e);mouse.x=p.x;mouse.y=p.y;
  if(e.button===0){
    for(const b of uiButtons)if(pointIn(mouse,b.x,b.y,b.w,b.h)){handleButton(b.id);return;}
    if(state==="settings"){for(const s of uiSliders)if(pointIn(mouse,s.x,s.y,s.w,s.h)){dragSlider=s.id;updateSlider(mouse.x);return;}}
  }
  if(state==="playing"){if(e.button===0){mouse.left=true;tryPrimary();} if(e.button===2){mouse.right=true;trySpecial();}}
});
canvas.addEventListener("pointerup",e=>{if(e.button===0)mouse.left=false;if(e.button===2)mouse.right=false;dragSlider=null;});
canvas.addEventListener("pointerleave",e=>{mouse.left=false;mouse.right=false;dragSlider=null;});
canvas.addEventListener("pointermove",e=>{let p=pointerPos(e);mouse.x=p.x;mouse.y=p.y;if(dragSlider)updateSlider(mouse.x);});
function updateSlider(mx){
  let s=uiSliders.find(a=>a.id===dragSlider); if(!s)return; let v=clamp((mx-s.x)/s.w,0,1);
  if(dragSlider==="music")settings.musicVol=v; else settings.sfxVol=v; saveSettings();
}
window.addEventListener("keydown",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
  keys[e.code]=true; audio.resume();
  if(e.code==="KeyM"&&!e.repeat){settings.sfxMuted=!settings.sfxMuted;saveSettings();audio.sfx("perk");}
  if(e.code==="KeyN"&&!e.repeat){settings.musicMuted=!settings.musicMuted;saveSettings();audio.sfx("perk");}
  if(state==="menu"&&menuMode==="class"&&!e.repeat&&/^Digit[1-8]$/.test(e.code)){selectedClassIndex=parseInt(e.code.slice(5),10)-1;storageSet(LS.lastClass,selectedClassIndex);audio.sfx("perk");}
  if(e.code==="Escape"&&!e.repeat){if(state==="settings"){state="menu";}else if(state==="menu"&&menuMode==="class")menuMode="main";}
  if(e.code==="KeyP"&&!e.repeat){if(state==="playing")state="paused";else if(state==="paused"){state="playing";processEventQueue();}}
  if(state==="playing"&&!e.repeat){
    if(e.code==="KeyT")tryClone(); if(e.code==="KeyQ")trySlime(); if(e.code==="KeyF")tryBone();
    if(e.code==="Space"){let now=performance.now(); if(now-lastSpaceTap<=250){player.tryDash();lastSpaceTap=-999;} else lastSpaceTap=now;}
  }
});
window.addEventListener("keyup",e=>{keys[e.code]=false;});

function loop(ts){
  if(!loop.last)loop.last=ts; let dt=Math.min(.033,(ts-loop.last)/1000); loop.last=ts;
  update(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();

</script>
