// ---- Sound design: every sound is a small recipe of oscillators, noise, envelopes and filters,
//      rendered once at boot through an OfflineAudioContext into an AudioBuffer. ----
const SR = 22050;
// recipe helpers (a = OfflineAudioContext, o = output node)
const SD = {
  noiseBuf(a, dur, kind = 'white', ch = 1) {
    const b = a.createBuffer(ch, Math.max(1, Math.ceil(dur * a.sampleRate)), a.sampleRate);
    for (let c = 0; c < ch; c++) { const d = b.getChannelData(c); let last = 0, b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1;
        if (kind === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
        else if (kind === 'pink') { b0 = 0.99765 * b0 + w * 0.099; b1 = 0.963 * b1 + w * 0.2965; b2 = 0.57 * b2 + w * 1.0527; d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.22; }
        else if (kind === 'crackle') d[i] = Math.random() < 0.02 ? w : 0;
        else d[i] = w; } }
    return b;
  },
  noise(a, dur, kind, t0 = 0) { const s = a.createBufferSource(); s.buffer = SD.noiseBuf(a, dur, kind); s.start(t0); return s; },
  osc(a, type, f, t0 = 0, dur = 1) { const o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t0); o.start(t0); o.stop(t0 + dur); return o; },
  // gain envelope from points [[t, v], ...] (linear) on a fresh GainNode
  env(a, input, pts, out) { const g = a.createGain(); g.gain.setValueAtTime(pts[0][1], pts[0][0]); for (let i = 1; i < pts.length; i++) g.gain.linearRampToValueAtTime(pts[i][1], pts[i][0]); input.connect(g); if (out) g.connect(out); return g; },
  // exponential decay envelope
  dec(a, input, t0, peak, len, out, att = 0.002) { const g = a.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(peak, t0 + att); g.gain.exponentialRampToValueAtTime(0.0001, t0 + att + len); input.connect(g); if (out) g.connect(out); return g; },
  filt(a, type, f, Q, input, out) { const b = a.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = Q; input.connect(b); if (out) b.connect(out); return b; },
  sweep(param, t0, v0, t1, v1, exp = true) { param.setValueAtTime(v0, t0); exp ? param.exponentialRampToValueAtTime(Math.max(1e-4, v1), t1) : param.linearRampToValueAtTime(v1, t1); },
  // burst of filtered noise
  hit(a, o, t0, f, Q, len, peak = 1, type = 'bandpass', kind = 'white') { const n = SD.noise(a, len + 0.05, kind, t0); const fl = SD.filt(a, type, f, Q, n); SD.dec(a, fl, t0, peak, len, o); return fl; },
  tone(a, o, t0, type, f, len, peak = 0.5, f1) { const s = SD.osc(a, type, f, t0, len + 0.1); if (f1) SD.sweep(s.frequency, t0, f, t0 + len, f1); SD.dec(a, s, t0, peak, len, o); return s; },
  // formant voice: saw through vowel band-passes
  formant(a, o, t0, f0, len, vowel, peak, drift = 0) {
    const F = { a: [730, 1090, 2440], o: [570, 840, 2410], u: [300, 870, 2240], e: [530, 1840, 2480], i: [270, 2290, 3010] }[vowel];
    const s = SD.osc(a, 'sawtooth', f0, t0, len + 0.1); if (drift) SD.sweep(s.frequency, t0, f0, t0 + len, f0 * drift, false);
    const lfo = SD.osc(a, 'sine', 5 + Math.random() * 2, t0, len + 0.1), lg = a.createGain(); lg.gain.value = f0 * 0.03; lfo.connect(lg); lg.connect(s.frequency);
    const n = SD.noise(a, len + 0.1, 'white', t0), ng = a.createGain(); ng.gain.value = 0.25; n.connect(ng);
    const mix = a.createGain(); s.connect(mix); ng.connect(mix);
    const env = a.createGain(); env.gain.setValueAtTime(0.0001, t0); env.gain.linearRampToValueAtTime(peak, t0 + len * 0.2); env.gain.linearRampToValueAtTime(peak * 0.7, t0 + len * 0.7); env.gain.linearRampToValueAtTime(0.0001, t0 + len); env.connect(o);
    F.forEach((f, i) => SD.filt(a, 'bandpass', f, 8 + i * 2, mix, env));
  },
};

}

// ===== SECTION: WORLD =====
// Room geometry builder: collects static geometry batched per texture, plus collision.
// Vertex colours carry fake ambient occlusion (darker low down and near walls/corners).
class RoomBuilder {
  constructor(bounds, height) {
    this.b = bounds; this.h = height; // bounds {x0,z0,x1,z1}
    this.batches = {}; this.segs = []; this.boxes = []; this.emissive = []; this.crouch = [];
    this.aoOn = true;
  }
  mb(tex) { return this.batches[tex] || (this.batches[tex] = new MB()); }
  ao(p, ignoreAxis) {
    const b = this.b; let d = 9;
    if (ignoreAxis !== 'x') d = Math.min(d, p[0] - b.x0, b.x1 - p[0]);
    if (ignoreAxis !== 'z') d = Math.min(d, p[2] - b.z0, b.z1 - p[2]);
    const wallF = lerp(TUNING.render.aoWall, 1, smooth(clamp(d / TUNING.render.aoWallDist, 0, 1)));
    const yF = lerp(TUNING.render.aoFloor, 1, smooth(clamp(p[1] / 1.4, 0, 1))) * lerp(1, TUNING.render.aoCeil, smooth(clamp((p[1] - (this.h - 0.6)) / 0.6, 0, 1)));
    const v = wallF * yF; return [v, v, v];
  }
  floor(x0, z0, x1, z1, y, tex, uvScale = 1, opts = {}) {
    this.mb(tex).grid([x0, y, z1], [x1 - x0, 0, 0], [0, 0, z0 - z1], opts.tile || 1, uvScale, [x0 / uvScale, -z1 / uvScale], opts.ao === false ? null : (p) => this.ao(p));

const UI = (() => {

  const cv = Tex.canvas(W, H), ctx = cv.getContext('2d');

  const PAL = {

    gold: '#bc9a46', goldD: '#6c5826', navy: '#0a0c18', navy2: '#141a30', navy3: '#28324e', black: '#000000',
    green: '#4caa48', yellow: '#d2c040', orange: '#d87830', violet: '#8a52b0',
  };
  // glyph atlas from FONT_HEX
  const atlas = Tex.canvas(95 * 8, 8);
  {
    const a = atlas.getContext('2d'), img = a.createImageData(95 * 8, 8);
    for (let g = 0; g < 95; g++) for (let row = 0; row < 8; row++) {
      const byte = parseInt(FONT_HEX.substr(g * 16 + row * 2, 2), 16);
      for (let bit = 0; bit < 8; bit++) if (byte & (1 << bit)) { const i = (row * 95 * 8 + g * 8 + bit) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = img.data[i + 3] = 255; }
    }
    a.putImageData(img, 0, 0);
  }
  const tinted = {};
  function tint(col, src = atlas) {
    const key = (src === atlas ? '' : 'h') + col;
    if (tinted[key]) return tinted[key];

    x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, 8);

  }
  const colOf = (c) => PAL[c] || c;
  const ADV = 8;

    s = String(s); const c = colOf(col);
    if (opts.align === 'center') x = Math.round(x - s.length * ADV / 2); else if (opts.align === 'right') x = Math.round(x - s.length * ADV);

})();

// ---- Title logo: "ASHGROVE" in a dripping serif, rasterised to 1-bit pixel art at boot ----
let TITLE_LOGO = null;
function makeTitleLogo() {
  const w = 300, h = 64, c = Tex.canvas(w, h), x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#fff'; x.font = 'bold 44px Georgia, "Times New Roman", serif'; x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillText(TEXT.title.logo, w / 2, 44);
  const img = x.getImageData(0, 0, w, h), d = img.data, rnd = mulberry32(1997);
  const on = (px, py) => d[(py * w + px) * 4 + 3] > 110;
  const out = x.createImageData(w, h), o = out.data;
  // threshold to 1-bit, two-tone (blood red with a dark outline), and drips from the letters' bottom edges
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) if (on(px, py)) { const i = (py * w + px) * 4; const shade = py < 26 ? [200, 40, 30] : [150, 20, 16]; o[i] = shade[0]; o[i + 1] = shade[1]; o[i + 2] = shade[2]; o[i + 3] = 255; }
  for (let px = 0; px < w; px++) { let bottom = -1; for (let py = h - 1; py > 0; py--) if (on(px, py)) { bottom = py; break; } if (bottom > 30 && rnd() < 0.16) { const len = 2 + rnd() * 16 | 0; for (let k = 1; k <= len && bottom + k < h; k++) { const i = ((bottom + k) * w + px) * 4; o[i] = 130; o[i + 1] = 14; o[i + 2] = 10; o[i + 3] = 255; } } }
  const final = Tex.canvas(w, h), f = final.getContext('2d'); f.putImageData(out, 0, 0);
  // dark outline
  const ol = Tex.canvas(w, h), oc = ol.getContext('2d'); for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) oc.drawImage(final, dx, dy); oc.globalCompositeOperation = 'source-in'; oc.fillStyle = '#100404'; oc.fillRect(0, 0, w, h); oc.globalCompositeOperation = 'source-over'; oc.drawImage(final, 0, 0);
  return ol;
}

// ===== SECTION: DEBUG =====

// Free-fly camera (render tests, and F1 in play)
const FreeCam = {
  pos: [0, 1.6, 3], yaw: 0, pitch: 0, prev: [0, 1.6, 3],
  update(dt) {
    this.prev = this.pos.slice();
    const mv = Input.move(), f = fwdVec(this.yaw, this.pitch), r = [Math.cos(this.yaw), 0, -Math.sin(this.yaw)];
    const sp = (Input.held('sprint') ? 8 : 3) * dt;
    for (let i = 0; i < 3; i++) this.pos[i] += (f[i] * mv.y + r[i] * mv.x) * sp;
    if (Input.held('jump')) this.pos[1] += sp; if (Input.isDown('KeyC') || Input.isDown('KeyQ')) this.pos[1] -= sp;
  },
  frame(fdt) { const l = Input.look(fdt); this.yaw -= l.dx; this.pitch = clamp(this.pitch - l.dy, -1.5, 1.5); },
  eye(alpha) { return v3.lerp(this.prev, this.pos, alpha); },
};
// gamepad aim slow-down: slower stick look while an enemy is near the crosshair
function aimSlowdown() {
  if (!Input.pad.connected || !World.room || !World.room.enemies) return 1;
  const e0 = Player.eye(1), f = fwdVec(Player.yaw, Player.pitch);
  for (const e of World.room.enemies) { if (!e.alive) continue; const c = [e.pos[0], e.pos[1] + 1.2, e.pos[2]], d = v3.sub(c, e0), l = v3.len(d); if (l < 15 && v3.dot(d, f) / l > Math.cos(deg(5))) return TUNING.input.aimSlow; }
  return 1;
}
// F3 overlay: collision, hit zones, shot rays, AI sight cones
let dbgLineMesh = null;
function drawDebugLines(room) {
  const mb = new MB(); const line = (a, b, c) => { const i = mb.vert(a, [0, 1, 0], [0, 0], c), j = mb.vert(b, [0, 1, 0], [0, 0], c); mb.i.push(i, j); };
  const y = 0.05;
  for (const s of room.segs) line([s[0], y, s[1]], [s[2], y, s[3]], [0.2, 1, 0.2]);
  for (const b of room.boxes) { const yy = Math.min(b.y1, 2); line([b.x0, yy, b.z0], [b.x1, yy, b.z0], [1, 1, 0.2]); line([b.x1, yy, b.z0], [b.x1, yy, b.z1], [1, 1, 0.2]); line([b.x1, yy, b.z1], [b.x0, yy, b.z1], [1, 1, 0.2]); line([b.x0, yy, b.z1], [b.x0, yy, b.z0], [1, 1, 0.2]); }
  for (const c of room.crouch) { const yy = c.y0; line([c.x0, yy, c.z0], [c.x1, yy, c.z1], [0.3, 0.6, 1]); line([c.x1, yy, c.z0], [c.x0, yy, c.z1], [0.3, 0.6, 1]); }
  for (const e of room.enemies || []) {
    const mats = e.tickMats(), hid = e.hidden();
    for (const p of e.rig.def.parts) {
      if (hid && hid.has(p.i)) continue; const m = mats[p.i], a = p.hit.mn, b = p.hit.mx;
      const c = [[a[0], a[1], a[2]], [b[0], a[1], a[2]], [b[0], b[1], a[2]], [a[0], b[1], a[2]], [a[0], a[1], b[2]], [b[0], a[1], b[2]], [b[0], b[1], b[2]], [a[0], b[1], b[2]]].map(q => m4.xform(m, q));
      const col = p.zone === 'head' ? [1, 0.2, 0.2] : p.zone === 'torso' ? [1, 0.6, 0.2] : [1, 0.4, 0.8];
      [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]].forEach(([i, j]) => line(c[i], c[j], col));
    }

}

// Solvability check: breadth-first search over rooms, key items and flags (run Debug.solve() in the console)
function solveCheck() {
  const have = new Set(), flags = new Set(['arrived']), opened = new Set(), seen = new Set(['front_gate']);
  const lockOk = (lock, id) => {
    if (!lock) return true; if (opened.has(id)) return true;
    if (typeof lock === 'object') { const f = lock.flag; return f[0] === '!' ? f.slice(1) === 'arrived' : flags.has(f); }
    if (lock === 'crests') return ['spring', 'summer', 'autumn', 'winter'].every(k => have.has('crest_' + k));
    if (lock === 'bolt') return true; if (lock === 'bolted' || lock === 'jammed') return false; return have.has(lock);
  };
  let changed = true, steps = 0;
  while (changed && steps++ < 200) {
    changed = false;
    if (seen.has('attic') && !have.has('photo')) { have.add('photo'); changed = true; }
    if (seen.has('root_chamber') && flags.has('phase3') && (have.has('flaregun') || have.has('sprayer')) && !flags.has('motherDead')) { flags.add('motherDead'); changed = true; }
    if (flags.has('boilerOverload') && !flags.has('escape')) { flags.add('escape'); changed = true; }
    for (const id of [...seen]) { const d = ROOMS[id];
      for (const p of d.items || []) if (p.item && !have.has(p.item)) { have.add(p.item); changed = true; }
      for (const s of d.spots || []) if ((!s.needs || have.has(s.needs)) && (!s.needsFlag || flags.has(s.needsFlag))) { if (s.gives && !have.has(s.gives)) { have.add(s.gives); changed = true; } if (s.setFlag && !flags.has(s.setFlag)) { flags.add(s.setFlag); if (s.setFlag === 'labActive') flags.add('phase3'); if (s.setFlag === 'motherDead') flags.add('escape'); changed = true; } }
      for (const dr of d.doors || []) { if (dr.hidden && !flags.has(dr.hidden.flag)) continue; if (lockOk(dr.lock, dr.id)) { if (dr.lock === 'bolt') opened.add(dr.id); if (!seen.has(dr.to) && ROOMS[dr.to]) { seen.add(dr.to); changed = true; } } }
    }
  }
  if (seen.has('root_chamber') && flags.has('phase3') && (have.has('flaregun') || have.has('sprayer')) && !flags.has('motherDead')) { flags.add('motherDead'); changed = true; }
  if (flags.has('boilerOverload')) flags.add('escape');
  const all = Object.keys(ROOMS), unreachable = all.filter(r => !seen.has(r));
  const ok = flags.has('escape') && unreachable.length === 0;
  const res = { ok, reached: seen.size, of: all.length, unreachable, flags: [...flags], items: [...have] };
  console[ok ? 'log' : 'error']('[solve]', JSON.stringify(res)); return res;
}

(function boot() {

    document.body.innerHTML = '<p style="color:#dcd2b8;font:16px monospace;text-align:center;margin-top:40vh">' + TEXT.ui.noWebgl + '<br>' + e.message + '</p>'; return;

  document.addEventListener('visibilitychange', () => { G.paused = document.hidden; Audio.suspend(document.hidden); });
  SoundEvents.init(); loadSettings(); G.meta = loadMeta();
  const direct = CONFIG.TEST === 'cube' ? 'cubeTest' : CONFIG.TEST === 'render' ? 'renderTest' : (CONFIG.TEST || QS.get('room')) ? 'play' : SETTINGS.calibrated ? 'boot' : 'calibrate';
  Stack.push('loading', { next: direct });
  // the AudioContext can only start on a user gesture
  addEventListener('keydown', () => Audio.init(), { once: true }); canvas.addEventListener('mousedown', () => Audio.init(), { once: true });
  let last = performance.now(), acc = 0, lastRender = 0;
  function frame(now) {
